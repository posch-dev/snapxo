[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapxo"
# Single source of truth is snapxo/__init__.py, see [tool.hatch.version]
dynamic = ["version"]
description = "Turn a Snapchat data export into an offline archive with a UI for desktop and phone: media, chats, statistics, maps, PDFs and spreadsheets."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "posch-dev" },
]
keywords = [
    "snapchat",
    "snapxo",
    "export",
    "data-export",
    "organizer",
    "organiser",
    "memories",
    "chat-history",
    "archive",
    "backup",
    "offline",
    "media-organizer",
    "photos",
    "videos",
    "video-encoding",
    "h265",
    "hevc",
    "ffmpeg",
    "exif",
    "gps",
    "geotagging",
    "deduplication",
    "html-report",
    "pdf-export",
    "spreadsheet",
    "xlsx",
    "excel",
    "statistics",
    "charts",
    "snap-map",
    "geolocation",
    "docker",
    "self-hosted",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "piexif>=1.1.3",
    # 12.3.0 fixes CVE-2026-59204, a memory exhaustion bug in the JPEG2000 decoder
    "Pillow>=12.3.0",
    # the browser comes separately from `playwright install chromium`
    "playwright>=1.40",
    # Windows ships no timezone database, so zoneinfo has nothing to read without this
    "tzdata; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/posch-dev/snapxo"
Repository = "https://github.com/posch-dev/snapxo"
Issues = "https://github.com/posch-dev/snapxo/issues"

[project.optional-dependencies]
# ffmpeg/ffprobe binaries for systems without them, at the cost of hardware encoding
ffmpeg = ["static-ffmpeg>=2.5"]
# only for `snapxo docker`: password hashing and merging into an existing compose file
docker = ["bcrypt>=4.0", "PyYAML>=6.0"]
# only for `snapxo spreadsheet --format xlsx`, which writes real editable Excel charts
spreadsheet = ["openpyxl>=3.1"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "build", "twine"]

[project.scripts]
snapxo = "snapxo.cli:main"

[tool.hatch.version]
path = "snapxo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["snapxo"]

# Lucide is ISC, which wants its notice in every copy, so the credits go into
# the wheel and not only into the repository.
[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "snapxo/THIRD-PARTY-NOTICES.md"

[tool.hatch.build.targets.sdist]
# tests ship too, so the sdist can be verified without cloning the repo.
# hatchling adds .gitignore on top of this and offers no way to opt out.
include = ["snapxo", "tests", "README.md", "DOCUMENTATION.md", "PREVIEW.md", "LICENSE",
           "CHANGELOG.md", "THIRD-PARTY-NOTICES.md"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned explicitly so CI does not start failing when a ruff release changes
# what it checks by default.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    # Rich markup and f-strings are used together all over the output code
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
# These build HTML, CSS and JS as string literals, where wrapping a line only
# makes the generated markup harder to read.
"snapxo/app/*.py" = ["E501"]
"snapxo/parts/*.py" = ["E501"]
"snapxo/pages/*.py" = ["E501"]
"snapxo/facts/provenance.py" = ["E501"]
"snapxo/formats/plaingallery.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["snapxo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is not a package, so conftest helpers are imported by module name
pythonpath = ["tests", "."]
addopts = "-q"
