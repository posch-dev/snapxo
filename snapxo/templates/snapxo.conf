# Written by `snapxo docker --password`. Basic auth in front of the archive.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "SnapXO archive";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }
}
