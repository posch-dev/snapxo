# Written by `snapxo docker`. The parent folder is mounted, so a swapped-in
# archive of the same name is served without a restart.
server {
    listen 80;
    server_name _;
    root "__ROOT__";
    index index.html;
__AUTH__
    # .htpasswd sits beside the compose file, often inside the archive.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
